# =============================================================================
# Puzzlebot Pallet Loader — Docker Compose
# =============================================================================
# Antes de levantar los servicios que usen ventana gráfica (ros-camera):
#   xhost +local:root
#
# Levantar todo:
#   docker compose up
#
# Apagar todo:
#   docker compose down
#
# Ver logs de un servicio específico:
#   docker compose logs -f flask-web
# =============================================================================

x-python: &python /home/robotics/miniconda3/envs/te300xb/bin/python  # Python del env te300xb

x-base: &base                             # bloque reutilizable con config común
  image: arturocerontec/robotics:oslm3
  network_mode: host                      # todos comparten la red del host → ROS2 DDS funciona entre servicios
  privileged: true                        # acceso a hardware (cámara CSI, FPGA, GPU)
  ipc: host                               # memoria compartida entre contenedores (requerido por ROS2)
  environment:
    - USER=robotics
    - PASSWD=robotics
    - DISPLAY=:1
  volumes:
    - /home/kim/puzzlebot-pallet-loader:/home/robotics/puzzlebot-pallet-loader
    - /home/kim/irs_tec/m4_interfaces:/home/robotics/m4_interfaces
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /dev/shm:/dev/shm
  devices:
    - /dev/dri:/dev/dri


services:

  # ── Servicio 1: Gateway REST (Go) ──────────────────────────────────────────
  # Convierte llamadas gRPC en una REST API accesible por HTTP en el puerto 8042.
  # Flask llama a este servicio para obtener las coordenadas X,Y del robot.
  go-gateway:
    <<: *base
    container_name: te3003b-gateway
    working_dir: /home/robotics/puzzlebot-pallet-loader/web-interface/GO-REST-Gateway-Linux
    command: ./gateway-app
    restart: unless-stopped

  # ── Servicio 2: Wrapper gRPC (Python) ──────────────────────────────────────
  # Lee los topics de ROS2 y los expone como servidor gRPC para el gateway de Go.
  grpc-wrapper:
    <<: *base
    container_name: te3003b-wrapper
    working_dir: /home/robotics/puzzlebot-pallet-loader/web-interface/PY-RPC-Wrapper-Server-Linux
    command: >
      bash -c "source /home/robotics/puzzlebot-pallet-loader/install/setup.bash &&
               /home/robotics/miniconda3/envs/te300xb/bin/python ros2-grpc-wrapper.py"
    depends_on:
      - go-gateway
    restart: unless-stopped

  # ── Servicio 3: Nodo de cámara ROS2 ────────────────────────────────────────
  # Recibe imágenes de /camera/image_raw y las publica en /image_result
  # para que Flask las transmita al navegador.
  ros-camera:
    <<: *base
    container_name: te3003b-ros
    working_dir: /home/robotics/puzzlebot-pallet-loader/web-interface/ROS-Object-Detection-Puzzlebot
    command: >
      bash -c "source /home/robotics/puzzlebot-pallet-loader/install/setup.bash &&
               /home/robotics/miniconda3/envs/te300xb/bin/python ros2-camera.py"
    restart: unless-stopped

  # ── Servicio 4: Servidor web Flask ─────────────────────────────────────────
  # Sirve la interfaz web en http://<IP-Jetson>:8002
  # Recibe imágenes de ROS2 y las transmite al navegador en tiempo real.
  flask-web:
    <<: *base
    container_name: te3003b-flask
    working_dir: /home/robotics/puzzlebot-pallet-loader/web-interface/FLASK-REST-Call-Linux
    command: >
      bash -c "source /home/robotics/puzzlebot-pallet-loader/install/setup.bash &&
               /home/robotics/miniconda3/envs/te300xb/bin/python app.py"
    depends_on:
      - go-gateway
      - grpc-wrapper
      - ros-camera
    restart: unless-stopped
