# =============================================================================
# Puzzlebot Pallet Loader — Docker Compose
# =============================================================================
# Levantar:
#   docker compose up
#
# Apagar:
#   docker compose down
#
# Ver logs:
#   docker compose logs -f flask-web
# =============================================================================

x-python: &python /home/robotics/miniconda3/envs/te300xb/bin/python  # Python del env te300xb

x-base: &base                             # bloque reutilizable con config común
  image: arturocerontec/robotics:oslm3
  network_mode: host                      # comparte la red del host → ROS2 DDS funciona
  privileged: true                        # acceso a hardware
  ipc: host                               # memoria compartida (requerido por ROS2)
  environment:
    - USER=robotics
    - PASSWD=robotics
    - DISPLAY=:1
  volumes:
    - .:/home/robotics/puzzlebot-pallet-loader
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /dev/shm:/dev/shm
  devices:
    - /dev/dri:/dev/dri


services:

  # ── Servidor web Flask ─────────────────────────────────────────────────────
  # Sirve la interfaz web en http://<IP-PC>:8002
  # Suscribe directamente los tópicos ROS 2: imagen anotada, mapa, detecciones.
  flask-web:
    <<: *base
    container_name: te3003b-flask
    working_dir: /home/robotics/puzzlebot-pallet-loader/web-interface/FLASK-REST-Call-Linux
    command: >
      bash -c "source /home/robotics/puzzlebot-pallet-loader/install/setup.bash &&
               /home/robotics/miniconda3/envs/te300xb/bin/python app.py"
    restart: unless-stopped
