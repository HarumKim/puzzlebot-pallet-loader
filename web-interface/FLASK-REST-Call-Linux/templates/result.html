<!DOCTYPE html>
<html lang="es">

  <head>
    <title>Puzzlebot Web Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>

  <body>

    <div class="dashboard">

      <header class="top-bar">
        <div class="box">
          <p class="box-label">Sistema</p>
          <h1><span class="status-dot"></span> Puzzlegoticas Live</h1>
        </div>

        <div class="box">
          <p class="box-label">Estado</p>
          <h1><span id="fsm-state">Cargando...</span></h1>
        </div>

        <div class="box">
          <p class="box-label">Coordenadas</p>
          <h1 class="coords" id="coords-display">X: ---&nbsp;|&nbsp;Y: ---</h1>
        </div>
      </header>

      <main class="main-content">
        <div class="camera">
          <h2>Front Camera View</h2>
          <img src="/video_feed" alt="Front Camera View">
        </div>

        <div class="localization">
          <h2>Real Time Localization Map</h2>
          <img src="/map_feed" alt="Puzzlebot real time localization">
        </div>
      </main>

      <footer class="bottom-bar">
        <span class="mic-icon">&#127908;</span>
        <h1>Voice Recognition</h1>
        <div class="voice-controls">
          <button class="btn-voice">START</button>
          <div class="voice-waves">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="voice-result" id="voice-result">---</span>
        </div>
      </footer>

    </div>

    <script>
      function updateFsmState() {
          fetch('/api/fsm_state')
              .then(r => r.text())
              .then(state => {
                  document.getElementById('fsm-state').textContent = state;
              })
              .catch(() => {
                  document.getElementById('fsm-state').textContent = 'Error';
              });
      }

      function updateCoords() {
          fetch('/api/pose')
              .then(r => r.json())
              .then(data => {
                  const el = document.getElementById('coords-display');
                  if (data.x !== null) {
                      const x = data.x.toFixed(2);
                      const y = data.y.toFixed(2);
                      el.textContent = `X: ${x} | Y: ${y}`;
                  } else {
                      el.textContent = 'X: --- | Y: ---';
                  }
              })
              .catch(() => {});
      }

      setInterval(updateFsmState, 1000);
      setInterval(updateCoords, 500);

      document.addEventListener('DOMContentLoaded', () => {
          updateFsmState();
          updateCoords();
      });
    </script>
  </body>

</html>
