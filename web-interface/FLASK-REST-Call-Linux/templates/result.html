<!DOCTYPE html>
<html>
  <head>
    <title>API Call Result & Video Feed</title>
    <script>
      function updateResult() {
        fetch('/api/result')
          .then(response => response.text())
          .then(result => {
            document.getElementById('result').textContent = result;
          })
          .catch(error => console.error('Error fetching data:', error));
      }
      setInterval(updateResult, 500);
    </script>
    <style>
      body { font-family: Arial, sans-serif; text-align: center; }
      .video-container { margin-top: 20px; }
      img { border: 2px solid #333; max-width: 640px; width: 100%; }
    </style>
  </head>
  <body>
    <h1>API Call Result</h1>
    <p><strong>Coordenadas (X, Y):</strong> <span id="result">Cargando...</span></p>
    
    <div class="video-container">
      <h2>Detección de Objetos en Tiempo Real</h2>
      <!-- La etiqueta img consume el stream de video de Flask -->
      <img src="{{ url_for('video_feed') }}" alt="ROS 2 Video Stream">
    </div>
  </body>
</html>
