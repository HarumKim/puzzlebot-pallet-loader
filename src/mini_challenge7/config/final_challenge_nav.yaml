tangent_bug_node:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/ekf_odom"
    scan_topic: "/scan"

    # Closed trajectory:
    # initial pose -> goal_1 -> goal_2 -> goal_3 -> goal_4 -> initial pose.
    waypoints:
      - -2.30   # WP0 — goal_1
      - -1.5
      - 1.50    # WP1 — goal_2
      - -0.85
      - -1.85   # WP2 — goal_3
      - 0.0
      - 1.25    # WP3 — goal_4
      - 1.35
      - 3.50    # WP_exit — via-point este del laberinto
      - 1.80
      - 1.45    # WP4 — regresa a la posicion inicial cerrada
      - 3.30

      # - -2.30   # WP0 — goal_1
      # - -1.5
      # - 1.50    # WP1 — goal_2
      # - -0.15
      # - -1.45   # WP2 — goal_3
      # - 1.0
      # - 1.35    # WP3 — goal_4
      # - 1.1
      # - 3.50    # WP_exit — via-point: fuerza salida al este del laberinto
      # - 1.80    #           (x=2.8 > Wall_40, y=1.0 < Wall_30 — camino libre)

    goal_tolerance: 0.05
    max_linear_speed: 0.22
    max_angular_speed: 0.30
    obstacle_threshold: 0.35
    wall_distance: 0.35
    front_half_angle_deg: 30.0
    goal_cone_deg: 27.0
    discontinuity_threshold: 0.35
    min_tangent_dist: 0.20
    bf_exit_margin: 0.10
    bf_min_travel: 0.50
    wait_for_localization: false
    yaw_covariance_threshold: 0.10
