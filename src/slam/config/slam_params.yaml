slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping

    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.5

    transform_publish_period: 0.02
    map_update_interval: 2.0

    do_loop_closing: true
    loop_search_maximum_distance: 3.0

    debug_logging: false
